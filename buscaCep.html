<!DOCTYPE html> 
<html lang="pt-BR"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>Cadastro de Endereço</title> 
 
    <style> 
        body { 
            font-family: Arial; 
            padding: 20px;
            background-color: rgb(222, 224, 226);
            display: flex;
            align-items: center;
            justify-content: center;
        } 

        .container{
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 40%;
            
        }
        form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            gap: 5px;
        }
        .deLadinho{
            display: flex;
        }
 
    </style> 
</head> 
 
<body> 
 
   <div class="container">
        <header>
            <h1>Cadastro de Endereço</h1> 
        </header>
    
        <form> 
    
            <label for="cep"> 
                CEP 
            </label> 
    
            <input 
                type="text" 
                id="cep" 
                placeholder="Digite o CEP" 
            > 
    
            <label for="logradouro"> 
                Rua 
            </label> 
    
            <input 
                type="text" 
                id="logradouro" 
            > 
    
           <div class="deLadinho">
                <label for="numero"> 
                    Número 
                </label> 
        
                <input 
                    type="text" 
                    id="numero" 
                > 
        
                <label for="bairro"> 
                    Bairro 
                </label> 
        
                <input 
                    type="text" 
                    id="bairro" 
                > 
           </div>
    
            <div class="deLadinho">
                <label for="cidade"> 
                    Cidade 
                </label> 
        
                <input 
                    type="text" 
                    id="cidade" 
                > 
        
                <label for="estado"> 
                    Estado 
                </label> 
        
                <input 
                    type="text" 
                    id="estado" 
                > 
            </div>
    
            <button 
                type="button" 
                onclick="buscarCep()" 
            > 
                Buscar CEP 
            </button> 
    
            <p id="mensagem"></p> 
    
        </form> 
   </div>
 
    <script src="./script.js"></script> 
 
</body> 
 
</html>
