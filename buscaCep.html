<!DOCTYPE html> 
<html lang="pt-BR"> 
 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
 
    <title>Cadastro de Endereço</title> 
 
    <style> 
        body { 
            font-family: Arial; 
            padding: 20px;
            background-color: rgb(222, 224, 226);
            display: flex;
            align-items: center;
            justify-content: center;
        } 

        .container{
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        form{
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
        }
        .deLadinhoContainer{
            display: flex;
            gap: 20px;
        }
        .emPe{
            display: flex;
            flex-direction: column;
        }

        input{
            border-style: solid;
            border-width: 1px;
            border-color: rgb(207, 207, 217);
            border-radius: 5px;
            padding: 4px;
        }
        
        button{
            border: none;
            border-radius: 5px;
            background-color: rgb(59, 59, 247);
            color: white;
            padding: 8px;
        }
 
    </style> 
</head> 
 
<body> 
 
   <div class="container">
        <header>
            <h1>Cadastro de Endereço</h1> 
        </header>
    
        <form> 
    
            <label for="cep"> 
                CEP 
            </label> 
    
            <input 
                type="text" 
                id="cep" 
                placeholder="Digite o CEP" 
            > 
    
            <label for="logradouro"> 
                Rua 
            </label> 
    
            <input 
                type="text" 
                id="logradouro" 
            > 
    
           <div class="">
                <div class="emPe">

                        <div class="deLadinhoContainer">
                            <div class="emPe">
                                    <label for="numero"> 
                                        Número 
                                    </label> 
                            
                                    <input 
                                        type="text" 
                                        id="numero" 
                                    > 
                            </div>
                    
                            <div class="emPe">
                                    <label for="bairro"> 
                                        Bairro 
                                    </label> 
                            
                                    <input 
                                        type="text" 
                                        id="bairro" 
                                    > 
                            </div>
                        </div>
                
            
                            <div class="deLadinhoContainer">
                                <div class="emPe">
                                    <label for="cidade"> 
                                        Cidade 
                                    </label> 
                            
                                    <input 
                                        type="text" 
                                        id="cidade" 
                                    > 
                                </div>

                            
                            
                                <div class="emPe" >
                                    <label for="estado"> 
                                        Estado 
                                    </label> 
                            
                                    <input 
                                        type="text" 
                                        id="estado" 
                                    >
                                </div>
                        </div>
                    </div>
                </div>
        
                <button 
                    type="button" 
                    onclick="buscarCep()" 
                > 
                    Buscar CEP 
                </button> 
        
                <p id="mensagem"></p>
           </div> 
    
        </form> 
   </div>
 
    <script src="./script.js"></script> 
 
</body> 
 
</html>
